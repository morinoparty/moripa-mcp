name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Workers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run check

      # デプロイトークンは BSM morinoparty プロジェクトの shared/CLOUDFLARE_API_TOKEN から取得
      # (MoriPath / kodama と同じパターン。access token は org secret)
      - name: Get deploy token from Bitwarden Secrets Manager
        uses: bitwarden/sm-action@v3.0.1
        with:
          access_token: ${{ secrets.NIKOMARU_BITWARDEN_SECRET_MANAGER_ACCESS_TOKEN }}
          secrets: |
            d1a5c5d9-41cc-48f0-9035-b49901583491 > CLOUDFLARE_API_TOKEN

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.OWNER_CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: deploy

      # Worker secrets (BEARER_TOKEN / MINEAUTH_SERVICE_TOKEN)。
      # repo secret がある時だけ設定する (初回デプロイで空にしないため)
      - name: Set Worker secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.OWNER_CLOUDFLARE_ACCOUNT_ID }}
          BEARER_TOKEN: ${{ secrets.BEARER_TOKEN }}
          MINEAUTH_SERVICE_TOKEN: ${{ secrets.MINEAUTH_SERVICE_TOKEN }}
        run: |
          if [ -n "$BEARER_TOKEN" ]; then
            printf '%s' "$BEARER_TOKEN" | pnpm exec wrangler secret put BEARER_TOKEN
          else
            echo "BEARER_TOKEN secret missing, skipping"
          fi
          if [ -n "$MINEAUTH_SERVICE_TOKEN" ]; then
            printf '%s' "$MINEAUTH_SERVICE_TOKEN" | pnpm exec wrangler secret put MINEAUTH_SERVICE_TOKEN
          else
            echo "MINEAUTH_SERVICE_TOKEN secret missing, skipping"
          fi
